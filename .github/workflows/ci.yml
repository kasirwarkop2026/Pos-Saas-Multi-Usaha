name: POS SaaS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pos-saas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-lockfile:
    name: Prepare and commit reproducible npm lockfile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload lockfile for this CI run
        uses: actions/upload-artifact@v4
        with:
          name: pos-saas-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Commit updated lockfile to PR branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: update reproducible npm lockfile"
          git push origin "HEAD:${BRANCH_NAME}"

  lint:
    name: ESLint
    needs: [prepare-lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: pos-saas-package-lock
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript typecheck
    needs: [prepare-lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: pos-saas-package-lock
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run TypeScript
        run: npx tsc --noEmit

  build:
    name: Next.js production build
    needs: [prepare-lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: pos-saas-package-lock
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  dependency-audit:
    name: Dependency security audit
    needs: [prepare-lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: pos-saas-package-lock
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit all dependency severities
        run: npm audit --audit-level=moderate
